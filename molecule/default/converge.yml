---
- name: Converge | Prepare the environment
  hosts: all
  become: true
  become_method: ansible.builtin.su
  tasks:
    - name: Ensure deps for apt_repository and refresh cache
      become: true
      when: ansible_facts.os_family == 'Debian'
      ansible.builtin.apt:
        name:
          - python3-debian
          - gnupg
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 600
      changed_when: false
    - name: Ensure archivematica group exists
      ansible.builtin.group:
        name: "archivematica"
        system: true
    - name: Ensure archivematica user exists
      ansible.builtin.user:
        name: "archivematica"
        group: "archivematica"
        system: true
        create_home: true

- name: Converge | Install MySQL, Nginx and RabbitMQ
  hosts: all
  become: true
  become_method: ansible.builtin.su
  vars:
    rabbitmq_version: "4.2.1"
    aipscan_test_mysql_users:
      - name: "aipscan"
        password: "aipscan"
        host: "localhost"
        priv: "aipscan.*:ALL,GRANT"
      - name: "celery"
        password: "celery"
        host: "localhost"
        priv: "celery.*:ALL,GRANT"
  roles:
    - role: geerlingguy.mysql
      tags: ["mysql"]
      vars:
        mysql_root_password: "Aej9okH.1hoD7laJc"
        mysql_databases:
          - name: "aipscan"
            encoding: "utf8mb4"
            collation: "utf8mb4_unicode_ci"
          - name: "celery"
            encoding: "utf8mb4"
            collation: "utf8mb4_unicode_ci"
        # The role's password parameter forces mysql_native_password, which
        # MySQL 8.4 disables. Create Resolute's users with the modern plugin below.
        mysql_users: "{{ [] if ansible_facts.distribution_release == 'resolute' else aipscan_test_mysql_users }}"
    - role: artefactual.nginx
      tags: ["nginx"]
      vars:
        nginx_sites:
          aipscan:
            - listen 8057
            - location /static/ {
              alias /usr/share/archivematica/AIPscan/static/;
              add_header Cache-Control "public, max-age=86400";
              access_log off;
              try_files $uri $uri/ =404;
              }
            - location / {
              proxy_pass http://127.0.0.1:4573;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
    - role: geerlingguy.rabbitmq
      when: ansible_facts.distribution_release != 'resolute'
      tags: ["rabbitmq", "molecule-idempotence-notest"]

  tasks:
    - name: Create MySQL 8.4 accounts on Ubuntu 26.04
      community.mysql.mysql_user:
        name: "{{ item.name }}"
        host: "{{ item.host }}"
        plugin: caching_sha2_password
        plugin_auth_string: "{{ item.password }}"
        # A fixed salt keeps these disposable test accounts idempotent.
        salt: "0123456789abcdefghij"
        priv: "{{ item.priv }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present
      loop: "{{ aipscan_test_mysql_users }}"
      when:
        - ansible_facts.distribution == 'Ubuntu'
        - ansible_facts.distribution_release == 'resolute'
      tags: ["mysql"]

    - name: Install RabbitMQ on Ubuntu 26.04
      ansible.builtin.import_tasks: tasks/rabbitmq-resolute.yml
      when:
        - ansible_facts.distribution == 'Ubuntu'
        - ansible_facts.distribution_release == 'resolute'
      tags: ["rabbitmq"]

- name: Converge | Install AIPscan
  hosts: all
  become: true
  become_method: ansible.builtin.su
  roles:
    - role: artefactual.aipscan
      tags: ["aipscan"]
      vars:
        aipscan_secret_key: "ea83b0fdfbf98803814f2e587a648afa3069941a7d89ec163797c30c29cd4910"
        aipscan_extra_envs:
          AIPSCAN_TEST_VAR: "molecule-test-value"
        aipscan_celery_config: |
          worker_concurrency = 1
          worker_prefetch_multiplier = 1
          worker_max_memory_per_child = 524_288  # 512 * 1024 = 512 MB
        aipscan_storage_sources:
          - name: "Demo Storage Service"
            url: "http://127.0.0.1:8000"
            username: "demo"
            api_key: "demo"
